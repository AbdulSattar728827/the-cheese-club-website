<body>
<div class="shell">
<header class="topbar">
 <a class="brand" href="/"><img src="/static/cheese-club-logo.png" alt="The Cheese Club"><span><small>Age of Empires IV</small><b class="brand-title">THE CHEESE CLUB</b><small class="brand-sub">COMMUNITY HUB</small></span></a>

 <a class="discord" id="discordLink" href="https://discord.gg/thecheeseclub" target="_blank" rel="noreferrer">JOIN DISCORD ↗</a>
</header>
<div class="member-layout"><aside class="side" id="memberSide" aria-label="Member menu"></aside><main id="memberMain"><div class="m-empty" style="padding:80px 10px">Loading…</div></main></div>
<footer class="footer"><span>© <span id="year"></span> THE CHEESE CLUB</span><span>Play Together. Laugh Together. Win Together.</span></footer>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=ccEsc,fmt=ccFmt;
$('year').textContent=new Date().getFullYear();

async function call(method,url,body){
 const r=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
 const data=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(data.detail||'Something went wrong. Please try again.');
 return data;
}
let days=90,me=null;
async function load(){
 const main=$('memberMain');let s;
 try{s=await call('GET','/api/me/stats?days='+days)}catch(e){main.innerHTML=`<div class="m-empty">${esc(e.message)}</div>`;return}
 const label=p=>p.t?new Date(p.t).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';
 const thin=arr=>{if(arr.length<=120)return arr;const step=arr.length/120;return Array.from({length:120},(_,i)=>arr[Math.floor(i*step)]).concat([arr[arr.length-1]])};
 const solo=thin(s.rating_history.solo||[]),team=thin(s.rating_history.team||[]);
 const series=[];if(solo.length>1)series.push({color:CC_COLORS.gold,label:'Solo',values:solo.map((p,i)=>({x:label(p)||'#'+(i+1),y:p.rating}))});
 if(team.length>1)series.push({color:CC_COLORS.blue,label:'Team',values:team.map((p,i)=>({x:label(p)||'#'+(i+1),y:p.rating}))});
 const change=a=>a.length>1?a[a.length-1].rating-a[0].rating:null,sign=v=>v>0?`<b style="color:${CC_COLORS.green}">+${v}</b>`:v<0?`<b style="color:${CC_COLORS.red}">${v}</b>`:'<b>±0</b>';
 const bits=[];if(change(solo)!==null)bits.push('Solo '+sign(change(solo)));if(change(team)!==null)bits.push('Team '+sign(change(team)));
 const period=days?`the last ${days} days`:'all time';
 let rating;
 if(!s.linked)rating=`<div class="m-empty">Link your AoE4 account to see your official rating over time. <a href="/account">Link it now</a></div>`;
 else if(!series.length)rating=`<div class="m-empty">No ranked games on AoE4World for ${period}.</div>`;
 else rating=ccRatingChart([{label:'Team',color:CC_COLORS.blue,points:team},{label:'Solo',color:CC_COLORS.gold,points:solo}])+`<p class="hint">From your AoE4World ranked games.${bits.length?' '+bits.join(' and ')+' in '+period+'.':''}</p>`;
 main.innerHTML=`
  <div class="m-head"><div><h1>Your stats</h1><p>How you play in the club, and your official rating.</p></div>
   <div class="chips" role="group" aria-label="Time period">${[[30,'30 days'],[90,'90 days'],[0,'All time']].map(([d,l])=>`<button type="button" data-days="${d}" class="${d===days?'on':''}" aria-pressed="${d===days}">${l}</button>`).join('')}</div></div>
  <section class="panel m-panel"><div class="panel-head"><h3>Official rating over time</h3><div class="legend"><span><i style="background:${CC_COLORS.gold}"></i>Solo</span><span><i style="background:${CC_COLORS.blue}"></i>Team</span></div></div><div class="m-body">${rating}</div></section>
  <div class="m-two">
   <section class="panel"><div class="panel-head"><h3>Games per queue</h3><small>Club matches</small></div><div class="m-body">${ccDonut(s.queues)}</div></section>
   <section class="panel"><div class="panel-head"><h3>When you play</h3><small>Your local time</small></div><div class="m-body">${ccHeatmap(s.match_times)}</div></section>
  </div>`;
 main.querySelectorAll('[data-days]').forEach(b=>b.addEventListener('click',()=>{days=Number(b.dataset.days);load()}));
}
(async()=>{me=await ccMemberInit('stats');if(me)load()})();

</script>
