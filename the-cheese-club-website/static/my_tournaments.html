*{box-sizing:border-box}body{margin:0;background:#080809;color:var(--white);font-family:Inter,Arial,sans-serif;position:relative;isolation:isolate}body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(rgba(7,7,8,.68),rgba(7,7,8,.82)),url("/static/home-hero-medieval.jpg") center center/cover no-repeat}a{color:inherit;text-decoration:none}.shell{max-width:1400px;margin:auto;padding:0 34px}.topbar{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12}.brand{display:flex;align-items:center;gap:14px}.brand img{width:155px;height:68px;object-fit:contain;object-position:left center}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase}.brand .brand-title{display:block;color:var(--white);font:800 19px/1.05 'Barlow Condensed',sans-serif;letter-spacing:1.1px;white-space:nowrap}.brand .brand-sub{font-size:9px;letter-spacing:2.5px;margin-top:4px;color:var(--gold)}.nav{display:flex;gap:17px;align-items:center;flex-wrap:wrap;color:#c8c4bc;font-size:12px}.nav a:hover{color:var(--gold)}.discord{background:linear-gradient(135deg,#f5c64c,#c98713);color:#201707;padding:12px 18px;border-radius:9px;font-weight:800;font-size:12px;letter-spacing:.4px;box-shadow:0 5px 24px #e5a61b25}.hero{padding:62px 28px 36px;margin:22px 0 26px;display:grid;grid-template-columns:1.25fr .75fr;gap:34px;align-items:center;border:1px solid #8a682b55;border-radius:18px;overflow:hidden;background:linear-gradient(145deg,#1b1b20,#121214);box-shadow:0 18px 55px #0008}.eyebrow{color:var(--gold);font-weight:800;letter-spacing:2.4px;text-transform:uppercase;font-size:11px}.hero h1{font:800 clamp(44px,6vw,76px)/.94 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.5px;margin:16px 0}.hero h1 span{color:var(--gold)}.hero p{color:#aaa7a0;max-width:610px;line-height:1.8;font-size:14px}.actions{display:flex;gap:12px;margin-top:25px}.btn{padding:14p mn}.panel > .table-wrap,.panel > .match-list{flex:1}.panel-footer{margin-top:auto;padding:12px 18px;display:flex;justify-content:flex-end;align-items:center;min-height:62px;border-top:1px solid var(--line);background:#151518}.members-more{display:flex;justify-content:center;margin:8px 0 30px}.members-more button{cursor:pointer;background:#17171b}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel-head h3{font:700 20px 'Barlow Condensed';text-transform:uppercase;letter-spacing:1px;margin:0}.tag{font-size:9px;letter-spacing:1px;text-transform:uppercase;border:1px solid #69511e;color:var(--gold);padding:6px 9px;border-radius:20px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:420px}th{text-align:left;color:#777;font-size:9px;letter-spacing:1px;text-transform:uppercase;font-weight:700;padding:13px 17px}td{padding:13px 17px;border-top:1px solid #ffffff0b;font-size:12px;color:#dedbd4}tr:hover td{background:#ffffff05}.rank{font:700 18px 'Barlow Condensed';color:var(--gold)}.player{font-weight:700}.sub{display:block;color:#777;font-size:10px;margin-top:3px}.elo{color:var(--gold2);font-weight:800}.queue-tabs{display:flex;gap:5px}.queue-tabs button{background:#222226;border:1px solid #333;color:#aaa;padding:6px 9px;border-radius:6px;font-size:10px;cursor:pointer}.queue-tabs button.active{background:#5b4212;color:#ffdb78;border-color:#99701e}.match-list{padding:5px 18px}.match{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #ffffff0c;gap:15px}.match:last-child{border:0}.match strong{font-size:12px}.match small{display:block;color:#777;margin-top:4px;font-size:10px}.result{font-size:9px;text-transform:uppercase;color:var(--green);border:1px solid #285a40;padding:6px 8px;border-radius:5px}.result.pending{color:var(--gold);border-color:#6e5424}.empty{padding:28px 20px;color:#777;font-size:12px;text-align:center}.footer{border-top:1px solid #ffffff12;padding:24px 0 35px;color:#777;font-size:10px;display:flex;justify-content:space-between}.toast{position:fixed;bottom:18px;right:18px;background:#251d0f;border:1px solid #72551c;color:#f1d28a;padding:10px 14px;border-radius:8px;font-size:11px;display:none}
@media(max-width:850px){.shell{padding:0 18px}.nav{display:flex;gap:10px;flex-wrap:wrap;font-size:11px}.hero{grid-template-columns:1fr;padding:42px 18px 26px;background-position:center;background-size:cover}.hero-card{max-width:100%}.columns{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.brand img{width:130px}.footer{gap:10px;flex-direction:column}}
@media(max-width:460px){.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:28px}.hero h1{font-size:48px}.actions{flex-wrap:wrap}}
.section-head h1{font:700 30px 'Barlow Condensed';text-transform:uppercase;letter-spacing:1px;margin:0}
.match{cursor:pointer;border:1px solid transparent;border-radius:8px;padding-left:10px;padding-right:10px;transition:.15s}.match:hover,.match:focus{background:#242126;border-color:#70551e;outline:none}.match-hint{display:block;color:#b08b39;font-size:9px;margin-top:4px}.detail-backdrop{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:100;overflow-y:auto}.detail-modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#19191e;border:1px solid #72551f;border-radius:14px;padding:22px}.detail-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.detail-head h2{font:700 25px 'Barlow Condensed';margin:0}.detail-close{background:#292930;border:1px solid #494951;color:#fff;border-radius:7px;padding:8px 12px;cursor:pointer}.detail-teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-team{background:#222228;border:1px solid #33333a;border-radius:10px;padding:13px}.detail-team h3{margin:0 0 12px;font:700 19px 'Barlow Condensed'}.detail-player{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid #ffffff12}.detail-player img{width:36px;height:36px;border-radius:50%;object-fit:cover}.detail-player b{font-size:12px;display:block}.detail-player small{color:#aaa;font-size:10px;display:block;margin-top:4px}.detail-meta{margin-top:14px;padding:12px;background:#222228;border-radius:9px;color:#aaa;font-size:11px;line-height:1.7}@media(max-width:600px){.detail-teams{grid-template-columns:1fr}}
</style>
<style>
.mt-list{width:100%;border-collapse:collapse;font-size:12.5px}
.mt-list th{padding:9px 8px;color:#8f8b82;font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;text-align:left;border-bottom:1px solid var(--line)}
.mt-list td{padding:11px 8px;border-bottom:1px solid #ffffff08;color:#cfcac0;vertical-align:middle}
.mt-list td a{color:var(--white);font-weight:700}.mt-list td a:hover{color:var(--gold)}
.mt-list small{display:block;color:#8f8b82;font-size:11px;margin-top:2px}
.mt-place{font:800 15px 'Barlow Condensed';white-space:nowrap}
.mt-place.gold{color:var(--gold2)}
.mt-games{display:grid;gap:6px;padding:10px 16px 16px}
.mt-g{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:#141417;border:1px solid #2c2a26;font-size:12.5px}
.mt-g .res{font:800 13px Inter;text-align:center;padding:4px 0;border-radius:6px}
.mt-g .res.W{background:#1e3a2b;color:#8fe0b2}.mt-g .res.L{background:#3a201c;color:#f0a090}.mt-g .res.P{background:#2a2213;color:var(--gold)}
.mt-g small{display:block;color:#8f8b82;font-size:11px}
.mt-g a{color:var(--gold);font-weight:700;font-size:11.5px;white-space:nowrap}
.mt-up{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 16px}
.mt-up a{padding:10px 14px;border-radius:10px;border:1px solid #6e5424;background:#2a2213;color:var(--gold);font-weight:700;font-size:12.5px}
@media(max-width:700px){.mt-list th:nth-child(3),.mt-list td:nth-child(3){display:none}}

<body>
<div class="shell">
<header class="topbar">
 <a class="brand" href="/"><img src="/static/cheese-club-logo.png" alt="The Cheese Club"><span><small>Age of Empires IV</small><b class="brand-title">THE CHEESE CLUB</b><small class="brand-sub">COMMUNITY HUB</small></span></a>
 <nav class="nav"><a href="/">Home</a><a href="/leaderboard">Leaderboard</a><a href="/matches">Matches</a><a href="/civs">Civ Stats</a><a href="/community">Community</a><a href="/voice-activity">Voice Activity</a><a href="/tournament">Tournament</a><a href="/about">About</a><a href="/contact">Contact Us</a><a href="/login">Log in</a></nav>
 <a class="discord" id="discordLink" href="https://discord.gg/thecheeseclub" target="_blank" rel="noreferrer">JOIN DISCORD ↗</a>
</header>
<div class="member-layout"><aside class="side" id="memberSide" aria-label="Member menu"></aside><main id="memberMain"><div class="m-empty" style="padding:80px 10px">Loading…</div></main></div>
<footer class="footer"><span>© <span id="year"></span> THE CHEESE CLUB</span><span>Play Together. Laugh Together. Win Together.</span></footer>
</div>
<div class="detail-backdrop" id="detailBackdrop" onclick="if(event.target===this)closeMatchDetail()"><section class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="detail-head"><h2 id="detailTitle">Match Details</h2><button class="detail-close" onclick="closeMatchDetail()">Close ✕</button></div><div id="detailContent"><div class="empty">Loading match details…</div></div></section></div>
<script>
const $=id=>document.getElementById(id);
const esc=ccEsc,fmt=ccFmt;
$('year').textContent=new Date().getFullYear();

async function call(method,url){const r=await fetch(url,{credentials:'same-origin'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Something went wrong.');return d}
const FMT={single:'⚔️ 1v1 Cup',teamcup:'👥 Team Cup',random3v3:'🎲 All Random',ffa:'🏁 Free-for-all'};
const day=d=>d?new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'';
function closeMatchDetail(){$('detailBackdrop').style.display='none';document.body.style.overflow=''}
async function openMatchDetail(id){$('detailBackdrop').style.display='flex';document.body.style.overflow='hidden';$('detailTitle').textContent='Match #'+id;const box=$('detailContent');box.innerHTML='<div class="empty">Loading match details…</div>';try{box.innerHTML=matchDetailHtml(await fetchMatchDetail(id))}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}. Please try again.</div>`}}
document.addEventListener('click',e=>{const m=e.target.closest('[data-match]');if(m){e.preventDefault();openMatchDetail(m.dataset.match)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMatchDetail()});
(async()=>{
 const me=await ccMemberInit('tournaments');if(!me)return;
 let d;try{d=await call('GET','/api/me/tournaments')}catch(e){$('memberMain').innerHTML=`<div class="m-empty">${esc(e.message)}</div>`;return}
 const s=d.summary,games=s.wins+s.losses;
 const medal=t=>t.status==='finished'&&t.place===1?'🏆':t.status==='finished'&&t.place===2?'🥈':t.status==='finished'&&t.place===3?'🥉':'';
 $('memberMain').innerHTML=`
  <div class="m-head"><div><h1>My tournaments</h1><p>Your tournament record. It's kept separate from your queue stats and ratings.</p></div><a class="btn primary" href="/tournament">Find a tournament</a></div>
  <div class="m-tiles">
   <div class="stat"><label>Tournaments</label><strong>${fmt(s.tournaments)}</strong><small>Played</small></div>
   <div class="stat"><label>Titles</label><strong>${s.titles?'🏆 '+fmt(s.titles):'0'}</strong><small>${fmt(s.podiums)} podium finish${s.podiums===1?'':'es'}</small></div>
   <div class="stat"><label>Tournament games</label><strong>${fmt(s.wins)}–${fmt(s.losses)}</strong><small>${games?Math.round(100*s.wins/games)+'% wins':'No games yet'}</small></div>
   <div class="stat"><label>FFA</label><strong>${fmt(s.ffa_rounds)}</strong><small>${s.ffa_rounds?fmt(s.ffa_firsts)+' first place'+(s.ffa_firsts===1?'':'s'):'No FFA rounds yet'}</small></div>
  </div>
  ${d.upcoming.length?`<section class="panel m-panel"><div class="panel-head"><h3>Signed up</h3></div><div class="mt-up">${d.upcoming.map(t=>`<a href="/tournament/${t.id}">${esc(FMT[t.format]||'')} · ${esc(t.name)}${t.team?' ('+esc(t.team)+')':''}</a>`).join('')}</div></section>`:''}
  <section class="panel m-panel"><div class="panel-head"><h3>Tournament history</h3></div>${d.tournaments.length?`<div style="overflow-x:auto;padding:4px 10px 10px"><table class="mt-list"><thead><tr><th>Tournament</th><th>Result</th><th>Record</th></tr></thead><tbody>${d.tournaments.map(t=>`<tr><td><a href="/tournament/${t.id}">${esc(t.name)}</a><small>${esc(FMT[t.format]||'')}${t.mode&&t.format!=='single'&&t.format!=='ffa'?' '+esc(t.mode):''}${t.team?' · '+esc(t.team):''} · ${day(t.finished_at||t.starts_at)}${t.status==='live'?' · <b style="color:#8fe0b2">live</b>':''}</small></td><td><span class="mt-place ${medal(t)?'gold':''}">${medal(t)} ${esc(t.label||'—')}</span></td><td>${t.format==='ffa'?'':`${t.wins}–${t.losses}`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="m-empty">You haven\'t played in a tournament yet. <a href="/tournament">See what\'s coming up</a></div>'}</section>
  <section class="panel m-panel"><div class="panel-head"><h3>Recent tournament games</h3></div>${d.games.length?`<div class="mt-games">${d.games.map(g=>`<div class="mt-g"><span class="res ${g.result==='W'||g.result==='L'?g.result:'P'}">${esc(g.result)}</span><div style="min-width:0"><b>${esc(g.label)}</b><small>${esc(g.tournament)} · ${day(g.at)}</small></div>${g.aoe_match_id?`<a href="#" data-match="${g.aoe_match_id}">Details ↗</a>`:'<span></span>'}</div>`).join('')}</div>`:'<div class="m-empty">No tournament games yet.</div>'}</section>`;
})();

</script>
