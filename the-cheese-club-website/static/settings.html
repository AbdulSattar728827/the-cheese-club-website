<script>
const $=id=>document.getElementById(id);
const esc=ccEsc,fmt=ccFmt;
$('year').textContent=new Date().getFullYear();

async function call(method,url,body){
 const r=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
 const data=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(data.detail||'Something went wrong. Please try again.');
 return data;
}
let me=null,al=null,alMsg=null;
const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const timeOptions=sel=>Array.from({length:48},(_,i)=>i*30).map(m=>`<option value="${m}" ${m===sel?'selected':''}>${hm(m)}</option>`).join('');
const WHEN=[['one_away','When it\'s 1 player away from starting','Fewest messages. Perfect if you just want to complete a match.'],['two_away','When it\'s 2 players away','A little more notice to get to your PC.'],['first_join','When someone joins an empty queue','For when you\'re always up for a game.']];
function deliveryHtml(){
 if(al.dm_status==='blocked')return `<div class="dm-bad"><b>⚠️ We couldn't send you a direct message</b>Discord blocked our last alert because your DMs from server members are turned off. To fix it:<ol><li>In Discord, right-click The Cheese Club server and open <b style="display:inline">Privacy Settings</b></li><li>Turn on <b style="display:inline">Direct Messages</b></li><li>Come back and press "Send me a test alert"</li></ol></div>`;
 if(al.dm_status==='failed')return '<div class="dm-bad"><b>⚠️ Our last direct message didn\'t go through</b>Discord had a problem delivering it. Press "Send me a test alert" to try again.</div>';
 if(al.dm_status==='ok')return `<div class="dm-ok">✅ Direct messages are working.${al.last_alert_at?' Last alert sent '+ccAgo(al.last_alert_at)+'.':''}</div>`;
 return '<p class="acct-note" style="margin:0">Press "Send me a test alert" after saving to check everything works.</p>';
}
function alertsHtml(){
 const muted=al.muted_until&&new Date(al.muted_until)>new Date();
 return `<section class="panel m-panel" id="alerts"><div class="panel-head"><h3>🔔 Queue alerts</h3>${al.enabled?'<small style="color:var(--green)">On</small>':'<small>Off</small>'}</div><div class="al-body ${al.enabled?'':'al-off'}">
  ${muted?`<div class="muted">🔕 Muted until ${new Date(al.muted_until).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}<button type="button" id="unmute">Unmute</button></div>`:''}
  <div class="al-row"><div class="master"><div><b>Send me queue alerts</b><small>A message when a queue you like is close to starting, so you never miss a match.</small></div><button type="button" class="switch" role="switch" id="alOn" aria-checked="${al.enabled}" aria-label="Send me queue alerts"></button></div></div>
  <div class="al-row"><h4>Which queues?</h4><p>Pick the ones you'd jump into.</p><div class="chipset" role="group" aria-label="Queues">${al.queue_options.map(q=>`<button type="button" class="qchip ${al.queues.includes(q)?'on':''}" data-q="${q}" aria-pressed="${al.queues.includes(q)}">${q.toUpperCase()}</button>`).join('')}</div></div>
  <div class="al-row"><h4>When should we tell you?</h4><p>One message per queue each time it fills up, never a stream of them, and at most one every 15 minutes.</p><div class="opts" role="radiogroup" aria-label="When to alert">${WHEN.map(([k,t,d])=>`<button type="button" class="opt ${al.alert_when===k?'on':''}" role="radio" aria-checked="${al.alert_when===k}" data-when="${k}"><i></i><div><b>${t}</b><small>${d}</small></div></button>`).join('')}</div></div>
  <div class="al-row"><h4>Quiet hours</h4><p>No alerts while you're asleep or busy.</p><div class="quiet"><button type="button" class="switch" role="switch" id="quietOn" aria-checked="${al.quiet_enabled}" aria-label="Quiet hours"></button><span>From</span><select class="sel" id="qStart" aria-label="Quiet hours start">${timeOptions(al.quiet_start)}</select><span>to</span><select class="sel" id="qEnd" aria-label="Quiet hours end">${timeOptions(al.quiet_end)}</select></div><div class="tz">Times are in your time zone: ${esc(TZ)} (detected automatically)</div></div>
  <div class="al-row"><h4>How should we tell you?</h4><p>Pick one or more.</p><div class="via">
   <label><input type="checkbox" id="viaDm" ${al.via_dm?'checked':''}>💬 Discord direct message<small>Reaches your phone, even with the website closed</small></label>
   <label><input type="checkbox" id="viaWeb" ${al.via_web?'checked':''}>🔔 Website bell<small>Shows in the bell at the top of the site</small></label>
   <label><input type="checkbox" id="viaBrowser" ${al.via_browser?'checked':''}>🖥️ Browser pop-up<small>While the website is open in a tab</small></label></div></div>
  <div class="al-row"><h4>Delivery</h4>${deliveryHtml()}
   <div class="al-actions"><button class="btn primary" type="button" id="alSave">Save alerts</button><button class="btn secondary" type="button" id="alTest" ${al.saved?'':'disabled title="Save your alerts first"'}>Send me a test alert</button></div>
   <div class="al-msg" id="alMsg">${alMsg?`<div class="msg ${alMsg.ok?'ok':'err'}">${esc(alMsg.text)}</div>`:''}</div></div>
 </div></section>`;
}
function render(){
 $('memberMain').innerHTML=`
 <div class="m-head"><div><h1>Settings</h1><p>Choose how we let you know about matches, and what others see.</p></div></div>
 ${alertsHtml()}
 <section class="panel m-panel"><div class="panel-head"><h3>Privacy</h3></div><div class="m-body">
  <div class="switch-row"><div><b>Hide my profile from the website</b></div><button class="switch" id="hideSwitch" type="button" role="switch" aria-checked="${me.hidden}" aria-label="Hide my profile from the website"></button></div>
  <p class="acct-note" id="hideNote">${me.hidden?"Your profile is hidden. You don't appear on leaderboards, member lists, player pages or highlights. Matches you played still count, shown as \"Hidden player\". Your Dashboard and Stats still work for you.":"When hidden, you won't appear on leaderboards, member lists, player pages or highlights. Matches you played still count, shown as \"Hidden player\". Your Dashboard and Stats keep working for you."}</p>
  <p class="acct-note"><a href="/privacy" style="color:var(--gold);font-weight:700">Read how we handle your information</a></p>
 </div></section>
 <section class="panel m-panel"><div class="panel-head"><h3>Login</h3></div><div class="m-body">
  <p>You're logged in with Discord as <b>${esc(me.username)}</b> (Discord ID ${esc(me.id_hint)}). There's no password to manage: Discord handles your login.</p>
  <a class="btn secondary" href="/auth/logout?next=/">Log out</a>
 </div></section>`;
 wire();
 if(location.hash==='#alerts')$('alerts').scrollIntoView();
}
function readForm(){return{enabled:$('alOn').getAttribute('aria-checked')==='true',queues:[...document.querySelectorAll('.qchip.on')].map(b=>b.dataset.q),
  alert_when:(document.querySelector('.opt.on')||{}).dataset?.when||'one_away',quiet_enabled:$('quietOn').getAttribute('aria-checked')==='true',
  quiet_start:Number($('qStart').value),quiet_end:Number($('qEnd').value),tz:TZ,via_dm:$('viaDm').checked,via_web:$('viaWeb').checked,via_browser:$('viaBrowser').checked}}
function wire(){
 const flip=b=>b.setAttribute('aria-checked',String(b.getAttribute('aria-checked')!=='true'));
 $('alOn').addEventListener('click',e=>{flip(e.currentTarget);document.querySelector('.al-body').classList.toggle('al-off',e.currentTarget.getAttribute('aria-checked')!=='true')});
 $('quietOn').addEventListener('click',e=>flip(e.currentTarget));
 document.querySelectorAll('.qchip').forEach(b=>b.addEventListener('click',()=>{b.classList.toggle('on');b.setAttribute('aria-pressed',String(b.classList.contains('on')))}));
 document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.opt').forEach(o=>{o.classList.toggle('on',o===b);o.setAttribute('aria-checked',String(o===b))})}));
 $('viaBrowser').addEventListener('change',async e=>{if(!e.target.checked)return;
  if(!('Notification' in window)){e.target.checked=false;alMsg={ok:false,text:"This browser doesn't support pop-up notifications."};$('alMsg').innerHTML=`<div class="msg err">${esc(alMsg.text)}</div>`;return}
  const perm=Notification.permission==='default'?await Notification.requestPermission():Notification.permission;
  if(perm!=='granted'){e.target.checked=false;$('alMsg').innerHTML='<div class="msg err">Your browser is blocking pop-ups from this site. Allow notifications for this site in your browser settings, then try again.</div>'}});
 $('alSave').addEventListener('click',async e=>{e.currentTarget.disabled=true;
  try{await call('POST','/api/me/alerts',readForm());al=await call('GET','/api/me/alerts');alMsg={ok:true,text:al.enabled?'Saved. Your queue alerts are on.':'Saved. Queue alerts are off.'}}catch(err){alMsg={ok:false,text:err.message}}
  render()});
 $('alTest').addEventListener('click',async e=>{e.currentTarget.disabled=true;$('alMsg').innerHTML='<div class="msg ok"><span class="spin"></span>Sending a test alert…</div>';
  try{const {requested_at}=await call('POST','/api/me/alerts/test');let done=false;
   for(let i=0;i<12&&!done;i++){await new Promise(r=>setTimeout(r,1500));al=await call('GET','/api/me/alerts');done=al.test_done_at&&new Date(al.test_done_at)>=new Date(requested_at)}
   alMsg=!done?{ok:false,text:"The bot didn't answer yet. Make sure it's online and try again."}:al.dm_status==='blocked'&&al.via_dm?{ok:false,text:"We couldn't DM you. See the steps above to allow direct messages."}:{ok:true,text:'Test sent! '+[al.via_dm?'Check your Discord DMs':'',al.via_web?'look at the bell at the top':''].filter(Boolean).join(' and ')+'.'}}
  catch(err){alMsg={ok:false,text:err.message}}
  render()});
 $('unmute')?.addEventListener('click',async()=>{await call('POST','/api/me/alerts/unmute');al=await call('GET','/api/me/alerts');render()});
 $('hideSwitch').addEventListener('click',async e=>{const sw=e.currentTarget,want=sw.getAttribute('aria-checked')!=='true';sw.disabled=true;
  try{await call('POST','/api/me/privacy',{hidden:want});me.hidden=want;await ccMemberInit('settings');render()}catch(err){sw.disabled=false;$('hideNote').textContent=err.message}});
}
(async()=>{me=await ccMemberInit('settings');if(!me)return;try{al=await call('GET','/api/me/alerts')}catch(e){al=null}
 if(!al){$('memberMain').innerHTML='<div class="m-empty">Settings could not be loaded. Refresh to try again.</div>';return}render()})();

</script>
