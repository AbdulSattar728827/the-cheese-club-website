<style>
.t-wrap{margin:28px 0 50px}
.t-hero{position:relative;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;padding:30px 32px;border-radius:18px;border:1px solid #8a682b;background:radial-gradient(120% 140% at 0% 0%,#3a2a0e 0%,#17150f 45%,#121214 100%);box-shadow:0 22px 60px #0008;overflow:hidden}
.t-hero::after{content:"🏆";position:absolute;right:28px;top:-6px;font-size:150px;opacity:.07;transform:rotate(12deg)}
.t-kicker{color:var(--gold);font-size:10.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.t-hero h1{font:800 clamp(38px,4.6vw,60px)/.95 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:10px 0 12px}
.t-hero p{color:#c8c3ba;font-size:14px;line-height:1.7;margin:0 0 18px;max-width:58ch}
.t-facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.t-facts span{padding:8px 12px;border-radius:20px;background:#ffffff0d;border:1px solid #ffffff1a;font-size:12px;color:#ddd8cf}
.t-cta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.t-cta .btn{padding:14px 22px;font-size:12px}
.t-cta small{color:#a29e95;font-size:12px}
.t-side{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.t-box{padding:16px 18px;border-radius:14px;background:#0f0f12cc;border:1px solid #3a3327}
.t-box label{display:block;color:#8f8b82;font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:8px}
.count{display:flex;gap:10px}.count div{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:#1b1a17;border:1px solid #2c2a26}
.count b{display:block;font:800 30px/1 'Barlow Condensed';color:var(--gold2)}.count small{color:#8f8b82;font-size:10px}
.spots{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:8px}.spots b{color:var(--white)}
.spotbar{height:9px;border-radius:6px;background:#26262b;overflow:hidden}.spotbar i{display:block;height:100%;background:linear-gradient(90deg,#98600c,#f0b82f)}
.avs{display:flex;margin-top:12px}.avs span{width:28px;height:28px;margin-right:-7px;border-radius:50%;border:2px solid #121214;background:#29251d;color:var(--gold);display:grid;place-items:center;font-size:11px;font-weight:800}
.prize{display:flex;gap:10px;align-items:center;font-size:12.5px;color:#ddd8cf;padding:4px 0}.prize b{color:var(--gold)}
.sec{margin:34px 0 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sec h2{font:700 28px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.8px;margin:0}.sec p{margin:4px 0 0;color:var(--muted);font-size:12px}
.t-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.t-card{padding:18px;border-radius:14px;background:linear-gradient(150deg,#1b1b20,#121214);border:1px solid #2c2a26;display:flex;flex-direction:column;gap:10px}
.t-card.now-on{border-color:#285a40;background:linear-gradient(150deg,#16251c,#121214)}
.t-card .tag{align-self:flex-start;padding:4px 9px;border-radius:20px;font:800 9.5px Inter;letter-spacing:.6px;text-transform:uppercase;border:1px solid #6e5424;color:var(--gold);background:#2a2213}
.t-card.now-on .tag{border-color:#285a40;color:#8fe0b2;background:#13241b}
.t-card h3{font:700 24px/1.05 'Barlow Condensed';text-transform:uppercase;margin:0}
.t-card p{margin:0;color:#9d998f;font-size:12px;line-height:1.6}
.t-card .meta{display:flex;flex-wrap:wrap;gap:6px}.t-card .meta span{font-size:11px;color:#cfcac0;padding:5px 9px;border-radius:8px;background:#ffffff0a}
.t-card .btn{margin-top:auto;text-align:center}
.hall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.champ{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:14px;border-radius:14px;background:#141417;border:1px solid #3a3327}
.champ .av{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;background:#2a2213;color:var(--gold);font:800 20px 'Barlow Condensed';position:relative}
.champ .av::after{content:"🏆";position:absolute;right:-6px;bottom:-4px;font-size:16px}
.champ b{display:block;font:700 18px 'Barlow Condensed';text-transform:uppercase}.champ small{display:block;color:#8f8b82;font-size:11px;line-height:1.5}
/* live tournament page */
.t-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.t-top h1{font:800 clamp(34px,4vw,50px)/1 'Barlow Condensed';text-transform:uppercase;margin:6px 0 6px}
.t-top p{margin:0;color:#a29e95;font-size:13px}
.livepill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:20px;background:#13241b;border:1px solid #285a40;color:#8fe0b2;font:800 10px Inter;letter-spacing:.8px;text-transform:uppercase}
.livepill i{width:7px;height:7px;border-radius:50%;background:#69d49a;box-shadow:0 0 0 0 #69d49a80;animation:lp 2s infinite}
@keyframes lp{0%{box-shadow:0 0 0 0 #69d49a80}70%{box-shadow:0 0 0 7px #69d49a00}100%{box-shadow:0 0 0 0 #69d49a00}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs span{padding:11px 16px;font-size:13px;font-weight:700;color:#9d998f;border-bottom:2px solid transparent;white-space:nowrap}
.tabs span.on{color:var(--gold);border-color:var(--gold)}
.mine{display:flex;align-items:center;gap:18px;padding:18px 20px;margin-bottom:18px;border-radius:14px;border:1px solid #5865f2;background:linear-gradient(135deg,#1c1f3a,#121214)}
.mine .vs{display:flex;align-items:center;gap:12px;font:700 22px 'Barlow Condensed';text-transform:uppercase}
.mine .vs em{font-style:normal;color:#8f8b82;font-size:14px}
.mine small{display:block;color:#b9bde8;font-size:12px;margin-top:3px}
.mine .btn{margin-left:auto;white-space:nowrap}
.t-main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.bracket-wrap{overflow-x:auto;padding:6px 2px 10px}
.bracket{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:34px;min-width:740px}
.round h4{margin:0 0 10px;font:700 15px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.8px;color:#a29e95;display:flex;justify-content:space-between}
.round h4 small{font:600 10.5px Inter;color:#6f6c66;text-transform:none;letter-spacing:0}
.round .col{display:flex;flex-direction:column;justify-content:space-around;height:520px}
.m{position:relative;border-radius:10px;background:#141417;border:1px solid #2c2a26;overflow:hidden}
.m.live{border-color:#285a40;box-shadow:0 0 0 1px #285a4088}
.m.my-m{border-color:#5865f2;box-shadow:0 0 0 1px #5865f288}
.m .p{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;font-size:12.5px}
.m .p+.p{border-top:1px solid #ffffff0a}
.m .seed{color:#6f6c66;font-size:10.5px;font-weight:800;text-align:center}
.m .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:#cfcac0}
.m .s{font:800 15px 'Barlow Condensed';color:#8f8b82;min-width:16px;text-align:right}
.m .p.w .n{color:var(--white)}.m .p.w .s{color:var(--gold2)}
.m .p.l .n{color:#6f6c66;text-decoration:line-through;text-decoration-color:#6f6c6688}
.m .p.tbd .n{color:#5f5c57;font-style:italic;font-weight:500}
.m .mh{display:flex;justify-content:space-between;padding:4px 10px;background:#ffffff06;font-size:10px;color:#8f8b82}
.m.live .mh{color:#8fe0b2}.m.my-m .mh{color:#b9bde8}
.round:not(:last-child) .m::after{content:"";position:absolute;right:-35px;top:50%;width:34px;height:1px;background:#3a3327}
.champ-slot{margin-top:14px;padding:14px;border-radius:12px;border:1px dashed #6e5424;text-align:center;color:#a29e95;font-size:12px}

.info{display:flex;flex-direction:column;gap:14px}

.maps{display:flex;flex-wrap:wrap;gap:6px}.maps span{padding:6px 10px;border-radius:8px;background:#1b1a17;border:1px solid #2c2a26;font-size:11.5px;color:#cfcac0}

.sched b{color:var(--white);font-weight:600}.sched .done{color:#6f6c66}.sched .now b{color:#8fe0b2}

.pl small{color:#8f8b82;font-size:10.5px}.pl .ok{color:#8fe0b2;font-size:11px;font-weight:800}.pl .wait{color:#8f8b82;font-size:11px}

 <a class="brand" href="/"><img src="/static/cheese-club-logo.png" alt="The Cheese Club"><span><small>Age of Empires IV</small><b class="brand-title">THE CHEESE CLUB</b><small class="brand-sub">COMMUNITY HUB</small></span></a>
 <nav class="nav"><a href="/">Home</a><a href="/leaderboard">Leaderboard</a><a href="/matches">Matches</a><a href="/civs">Civ Stats</a><a href="/community">Community</a><a href="/voice-activity">Voice Activity</a><a href="/tournament">Tournament</a><a href="/about">About</a><a href="/contact">Contact Us</a><a href="/login">Log in</a></nav>
 <a class="discord" id="discordLink" href="https://discord.gg/thecheeseclub" target="_blank" rel="noreferrer">JOIN DISCORD ↗</a>
</header>
<div class="t-wrap" id="tour"><div class="t-empty">Loading tournament…</div></div>
<footer class="footer"><span>© <span id="year"></span> THE CHEESE CLUB</span><span>Play Together. Laugh Together. Win Together.</span></footer>
</div>
<div class="detail-backdrop" id="detailBackdrop" onclick="if(event.target===this)closeMatchDetail()"><section class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="detail-head"><h2 id="detailTitle">Match Details</h2><button class="detail-close" onclick="closeMatchDetail()">Close ✕</button></div><div id="detailContent"><div class="empty">Loading match details…</div></div></section></div>
<script>
const $=id=>document.getElementById(id);
const esc=ccEsc,fmt=ccFmt;
$('year').textContent=new Date().getFullYear();

async function call(method,url,body){
 const r=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
 const data=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(data.detail||'Something went wrong. Please try again.');
 return data;
}
const when=d=>new Date(d).toLocaleString(undefined,{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
function until(d){let s=Math.max(0,Math.floor((new Date(d)-Date.now())/1000));const D=Math.floor(s/86400);s%=86400;const H=Math.floor(s/3600);s%=3600;const M=Math.floor(s/60),S=s%60;return {D,H,M,S}}
function untilText(d){const u=until(d);return u.D?`${u.D}d ${u.H}h`:u.H?`${u.H}h ${u.M}m`:`${String(u.M).padStart(2,'0')}:${String(u.S).padStart(2,'0')}`}
setInterval(()=>document.querySelectorAll('[data-until]').forEach(el=>{el.textContent=untilText(el.dataset.until)}),1000);
const boText=t=>t.bo_default===t.bo_semi&&t.bo_semi===t.bo_final?`Best of ${t.bo_final} every round`:`Best of ${t.bo_default} early rounds, ${t.bo_semi} semis, ${t.bo_final} final`;
const STATUS={signup:'Sign-ups open',checkin:'Check-in open',live:'Live',finished:'Finished',cancelled:'Cancelled'};
const initials=n=>esc((n||'?').trim().slice(0,1).toUpperCase());
const isRT=t=>t.format==='random3v3',isTeam=t=>t.format==='teamcup',isFFA=t=>t.format==='ffa';
const divText=t=>t.min_rating!=null&&t.max_rating!=null?`📊 Rating ${ccFmt(t.min_rating)}–${ccFmt(t.max_rating)}`:t.max_rating!=null?`📊 Under ${ccFmt(t.max_rating+1)}`:t.min_rating!=null?`📊 ${ccFmt(t.min_rating)}+ rating`:'';
const fmtName=t=>isRT(t)?`🎲 All Random ${t.mode||'3v3'}`:isTeam(t)?`👥 ${t.mode} Team Cup`:isFFA(t)?'🏁 Free-for-all':'⚔️ 1v1 Cup';
const fmtIcon=t=>isRT(t)?'🎲':isTeam(t)?'👥':isFFA(t)?'🏁':'⚔️';

function closeMatchDetail(){$('detailBackdrop').style.display='none';document.body.style.overflow=''}
async function openMatchDetail(id){$('detailBackdrop').style.display='flex';document.body.style.overflow='hidden';$('detailTitle').textContent='Match #'+id;const box=$('detailContent');box.innerHTML='<div class="empty">Loading match details…</div>';try{box.innerHTML=matchDetailHtml(await fetchMatchDetail(id))}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}. Please try again.</div>`}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMatchDetail()});

const TID=location.pathname.split('/')[2];
let D=null,tab=null,msg=null,busy=false,roundSel=null;
async function act(url,body,okText){if(busy)return;busy=true;try{const r=await call('POST',url,body||{});msg={ok:true,text:okText||r.message||'Done.'}}catch(e){msg={ok:false,text:e.message}}busy=false;await load()}
const name=p=>p?(p.team||!p.user_id?esc(p.username):`<a href="${ccPlayerHref(p.user_id)}">${esc(p.username)}</a>`):'';
const teamLine=m=>(m.p1&&m.p1.team)||(m.p2&&m.p2.team)?`<div class="civs">${[m.p1,m.p2].filter(x=>x&&x.team).map(x=>`<b>${esc(x.username)}:</b> ${x.members.map(y=>esc(y.username)).join(', ')}`).join('<br>')}</div>`:'';
function myCard(){
 const t=D.tournament,me=D.me,st=t.status;
 if(st==='finished')return D.winner?`<div class="checkin" style="border-color:#8a682b"><div class="big">🏆</div><div><b>${esc(D.winner.username)} ${D.winner.team?'are':'is'} the champion${D.winner.team?'s':''}!</b><small>${isFFA(t)?'Most points across the tournament. ':D.runner_up?'Beat '+esc(D.runner_up.username)+' in the final. ':''}GG to everyone who played.</small></div></div>`:'';
 if(st==='cancelled')return '<div class="t-msg err">This tournament was cancelled.</div>';
 if(!me.logged_in)return (st==='signup'||st==='checkin')?`<div class="mine"><div><div class="vs">Want to play?</div><small>Log in with Discord to sign up. It takes a few seconds.</small></div><a class="btn primary" href="/auth/login?next=${encodeURIComponent(location.pathname)}">Log in to sign up</a></div>`:'';
 if(st==='signup'||st==='checkin'){
  const e=me.eligible||{};
  if(!me.status||me.status==='withdrawn'||me.status==='no_show'){
   if(!e.in_server)return `<div class="need"><span class="ic">💬</span><div><b>Join the Discord to sign up</b><small>Tournament matches are played in The Cheese Club Discord.</small></div><a class="btn primary" href="https://discord.gg/thecheeseclub" target="_blank" rel="noopener noreferrer">Join Discord ↗</a></div>`;
   if(!e.linked)return `<div class="need"><span class="ic">🔗</span><div><b>Link your AoE4 account to sign up</b><small>Seeds are set by your AoE4World rating.</small></div><a class="btn primary" href="/account">Link AoE4 account</a></div>`;
   const full=D.players.filter(p=>p.status==='registered').length>=t.max_players;
   return `<div class="mine"><div><div class="vs">${full?'Tournament full':'Spots available'}</div><small>${full?'Sign up to join the waiting list. You get a spot if someone drops out.':'Sign up now. Check-in opens '+t.checkin_minutes+' minutes before it starts.'}</small></div><button class="btn primary" type="button" data-act="signup">${full?'Join the waiting list':'✍️ Sign up'}</button></div>`;
  }
  const wl=me.status==='waitlist';
  if(st==='signup')return `<div class="you"><i class="pulse"></i><div><b>${wl?"You're on the waiting list":"You're signed up!"}</b><small>Check-in opens ${esc(when(t.checkin_opens_at))} (in <span data-until="${t.checkin_opens_at}">${untilText(t.checkin_opens_at)}</span>). We'll notify you.</small></div><button class="btn danger" type="button" data-act="withdraw">Withdraw</button></div>`;
  return `<div class="steps3"><div class="st done"><span>✓ Step 1</span><b>${wl?'On the waiting list':'Signed up'}</b><p>${wl?'If a player doesn\'t check in, the first checked-in player on the waiting list takes the spot.':'Seeds are set by AoE4World rating when it starts.'}</p></div>
   <div class="st ${me.checked_in?'done':'now'}"><span>${me.checked_in?'✓':'●'} Step 2${me.checked_in?'':' · Now'}</span><b>${me.checked_in?'Checked in':'Check in'}</b><p>${me.checked_in?'You\'re all set.':'Confirm you\'re here before it starts.'}</p></div>

function ffaRules(){const t=D.tournament;return `<div class="info-body" style="padding:18px 20px"><ul>
 <li><b>Format:</b> free-for-all. Everyone signs up alone and all players (2–8) play in the same lobby${t.rounds>1?`, over ${t.rounds} rounds. Points add up across rounds`:''}.</li>

 <li><b>Results:</b> Age of Empires IV doesn't report finishing places automatically, so a player submits the final order on the website and other players confirm it (at least half of the lobby, including the reporter). Anyone can dispute, and an admin then sets the result.</li>

 ${t.prizes?`<p style="margin-top:12px"><b>Prizes:</b> ${esc(t.prizes)}</p>`:''}${t.rules?`<p style="margin-top:12px"><b>Rules</b></p><p class="rules-text">${esc(t.rules)}</p>`:''}</div>`}
let rtRound=null;
function rtCard(){
 const R=D.random,t=D.tournament,me=D.me;if(t.status!=='live')return '';
 const m=R.my_match;
 if(m){const mine=m.my_team,us=mine===1?m.team1:m.team2,them=mine===1?m.team2:m.team1,usAvg=mine===1?m.team1_avg:m.team2_avg,themAvg=mine===1?m.team2_avg:m.team1_avg,playing=m.status==='playing'||m.status==='starting';
  return `<div class="mine"><div style="min-width:0"><div class="vs">Round ${m.round} · Match ${m.match_no}</div>
   <small>Your team: <b style="color:#fff">${us.map(p=>p.me?'You':esc(p.username)).join(', ')}</b> (avg ${fmt(usAvg)}) vs ${them.map(p=>esc(p.username)).join(', ')} (avg ${fmt(themAvg)})${m.map?` · Map: <b style="color:#fff">${esc(m.map)}</b>`:''}.<br>
   ${playing?'Your match is on in Discord: head to the match thread for civ bans and picks.':m.me_ready?`You're ready. The match starts in Discord as soon as all ${m.team1.length*2} players are ready.`:'Join a voice channel in Discord, then press I\'m ready.'}</small>
   ${playing?'':`<div class="ready-row"><span class="rdy ${m.me_ready?'yes':''}">${m.me_ready?'✓':'○'} You</span><span class="rdy ${m.ready_count===m.team1.length*2?'yes':''}">${m.ready_count} of ${m.team1.length*2} ready</span></div>`}</div>
   ${playing?'<a class="btn primary" href="https://discord.com/channels/@me" target="_blank" rel="noopener noreferrer">Open Discord ↗</a>':m.me_ready?`<button class="btn danger" type="button" data-tready="${m.id}" data-on="0">Not ready</button>`:`<button class="btn primary" type="button" data-tready="${m.id}" data-on="1">✅ I'm ready</button>`}</div>`}
 if(R.my_bye)return `<div class="you"><i class="pulse"></i><div><b>You're sitting out round ${t.current_round}</b><small>You get ${t.points_bye} point${t.points_bye===1?'':'s'}, and you won't sit out again until everyone else has. Stay nearby: an admin may call you in as a substitute.</small></div></div>`;
 if(me.status==='removed')return '<div class="t-msg err">You were removed from the remaining rounds. Your points so far still count.</div>';
 if(me.status==='playing')return '<div class="t-msg ok">Your match this round is done. The next round\'s teams appear as soon as every match has finished.</div>';
 return '';
}
function rtSide(team,avg,cls,right,m){

function rtMatch(m,round){

 const c1=m.winner_team===1?'rt-win':m.winner_team===2?'rt-lose':'',c2=m.winner_team===2?'rt-win':m.winner_team===1?'rt-lose':'';

 }
 return `<div class="rt-mc ${m.me_in?'rt-mine':live?'rt-on':''}"><div class="rt-mh"><b>Match ${m.match_no}</b><span class="rt-st" style="color:${scol}">${stxt}</span></div>
  <div class="rt-mb">${rtSide(m.team1,m.team1_avg,c1,false,m)}<div class="rt-vs">${m.winner_team?`<b>${m.winner_team===1?'1–0':'0–1'}</b>Team ${m.winner_team}`:'vs'}</div>${rtSide(m.team2,m.team2_avg,c2,true,m)}</div>

function rtStandings(){

function rtPodium(){

function rtMain(){
 const R=D.random,t=D.tournament;
 if(!R.rounds.length)return '<div class="t-empty">The first round\'s teams are made when the tournament starts.</div>';
 if(rtRound===null||!R.rounds.find(r=>r.round===rtRound))rtRound=R.rounds[R.rounds.length-1].round;
 const sel=R.rounds.find(r=>r.round===rtRound);
 const tabs=R.rounds.map(r=>{const done=r.matches.every(m=>m.status==='done'||m.status==='void');return `<button type="button" class="${r.round===rtRound?'on':done?'done':''}" data-rround="${r.round}">Round ${r.round}${done?' ✓':r.round===t.current_round&&t.status==='live'?' · live':''}</button>`}).join('')+
  Array.from({length:Math.max(0,t.rounds-R.rounds.length)},(_,i)=>`<span>Round ${R.rounds.length+i+1}</span>`).join('');
 const byes=sel.byes.length?`<div class="rt-byes">🪑 <b>Sat out round ${sel.round}:</b> ${sel.byes.map(b=>esc(b.username)+(b.substituted_into?' (subbed in)':'')).join(', ')}. ${t.status==='live'&&sel.round===t.current_round?`They get ${t.points_bye} point${t.points_bye===1?'':'s'}, can be called in as substitutes, and won't sit out again until everyone else has.`:''}</div>`:'';
 return `${t.status==='finished'?rtPodium():''}<div class="rt-grid"><div><div class="rt-tabs">${tabs}</div>${sel.map?`<p style="margin:-4px 0 12px;color:#a29e95;font-size:12.5px">🗺️ Round ${sel.round} map: <b style="color:#fff">${esc(sel.map)}</b></p>`:''}<div class="rt-mlist">${sel.matches.map(m=>rtMatch(m,sel)).join('')}</div>${byes}</div>

function rtRules(){const t=D.tournament;
 return `<div class="info-body" style="padding:18px 20px"><ul>
  <li><b>Format:</b> everyone signs up alone. Each round, the website makes new random ${esc(t.mode)} teams, balanced by AoE4World rating, and avoids giving you the same teammates twice.</li>
  <li><b>Rounds:</b> ${t.rounds}. Each round, every team plays one match.</li>
  <li><b>Points (individual):</b> win = ${t.points_win}, loss = 0, sitting out = ${t.points_bye}. Your points are yours, even though you play in a team.</li>
  <li><b>Sitting out:</b> if the number of players isn't a multiple of ${(t.team_size||3)*2}, a few players sit out each round. Whoever has sat out the least goes first, and nobody sits out twice in a row if it can be avoided. Players sitting out can be called in as substitutes.</li>
  <li><b>Ties:</b> opponents' points (beating strong players counts more), then fewer sit-outs, then rating.</li>
  <li><b>Playing:</b> when your teams are out, every player in the match presses <b>I'm ready</b>. The bot starts the match in Discord with your teams already set, runs civ bans and picks, and both sides confirm the result.</li>

  if(!confirm('Submit these placements? The other players will be asked to confirm.'))return;fp.disabled=true;await act(`/api/tournaments/${TID}/ffa-report`,{match_id:+fp.dataset.freport,order:o,civs:civsOf(fp.dataset.freport)},'Placements submitted. Waiting for the others to confirm.');return}
 const fc=e.target.closest('[data-fconf]');if(fc){if(fc.dataset.agree!=='1'&&!confirm('Dispute these placements? An admin will set the result.'))return;fc.disabled=true;
  await act(`/api/tournaments/${TID}/ffa-confirm`,{match_id:+fc.dataset.fconf,agree:fc.dataset.agree==='1'},fc.dataset.agree==='1'?'Confirmed. Thanks!':'Disputed. An admin will decide.');return}
 const fs=e.target.closest('[data-fset]');if(fs){const o=orderOf(fs.dataset.fset);if(new Set(o).size!==o.length){msg={ok:false,text:'Each player can only be in one place.'};render();return}
  if(!confirm('Save these placements as final?'))return;fs.disabled=true;await act(`/api/tournaments/${TID}/admin`,{action:'ffa_result',match_id:+fs.dataset.fset,order:o,civs:civsOf(fs.dataset.fset)});return}
 const fa=e.target.closest('[data-fapprove]');if(fa){fa.disabled=true;await act(`/api/tournaments/${TID}/admin`,{action:'ffa_approve',match_id:+fa.dataset.fapprove});return}
 const rr=e.target.closest('[data-rround]');if(rr){rtRound=+rr.dataset.rround;render();return}
 const tr=e.target.closest('[data-tready]');if(tr){tr.disabled=true;await act(`/api/tournaments/${TID}/team-ready`,{match_id:+tr.dataset.tready,ready:tr.dataset.on==='1'},tr.dataset.on==='1'?"You're ready! The match starts in Discord when all six players are ready.":'Marked as not ready.');return}
 const tres=e.target.closest('[data-tres]');if(tres){const sel=tres.previousElementSibling;if(!confirm('Save this result? Standings update straight away.'))return;tres.disabled=true;
  await act(`/api/tournaments/${TID}/admin`,{action:'team_result',match_id:+tres.dataset.tres,winner_team:+sel.value});return}
 const tsub=e.target.closest('[data-tsub]');if(tsub){const inSel=tsub.previousElementSibling,outSel=inSel.previousElementSibling;if(!confirm(`${inSel.options[inSel.selectedIndex].text.replace('In: ','')} replaces ${outSel.options[outSel.selectedIndex].text.replace('Out: ','')}?`))return;tsub.disabled=true;
  await act(`/api/tournaments/${TID}/admin`,{action:'substitute',match_id:+tsub.dataset.tsub,out_user:outSel.value,in_user:inSel.value});return}
 const rb=e.target.closest('[data-round]');if(rb){roundSel=+rb.dataset.round;render();return}
 const mm=e.target.closest('[data-match]');if(mm){e.preventDefault();openMatchDetail(mm.dataset.match);return}
 if(e.target.id==='shareBtn'){try{await navigator.clipboard.writeText(location.href);e.target.textContent='Link copied ✓'}catch(_){};return}
 const a=e.target.closest('[data-act]');if(a){const k=a.dataset.act;if(a.dataset.confirm&&!confirm(a.dataset.confirm))return;a.disabled=true;
  await act(`/api/tournaments/${TID}/${k}`,{},{signup:"You're signed up! Check-in opens before the start.",withdraw:'You withdrew from the tournament.',checkin:"Checked in. You're all set!"}[k]);return}
 const r=e.target.closest('[data-ready]');if(r){r.disabled=true;await act(`/api/tournaments/${TID}/ready`,{match_id:+r.dataset.ready,ready:r.dataset.on==='1'},r.dataset.on==='1'?"You're ready! The game starts in Discord when your opponent is ready too.":"Marked as not ready.");return}
 const ad=e.target.closest('[data-admin]');if(ad){if(ad.dataset.confirm&&!confirm(ad.dataset.confirm))return;ad.disabled=true;
  await act(`/api/tournaments/${TID}/admin`,{action:ad.dataset.admin,user:ad.dataset.admin==='remove_player'?$('rmSel').value:undefined});return}
 const sw=e.target.closest('[data-setwin]');if(sw){const sel=sw.parentElement.querySelector('select');if(!confirm('Set '+sel.options[sel.selectedIndex].text+' as the winner of this match?'))return;sw.disabled=true;
  await act(`/api/tournaments/${TID}/admin`,{action:'set_winner',match_id:+sw.dataset.setwin,winner:sel.value});return}
});
document.addEventListener('submit',async e=>{if(e.target.id!=='teamForm')return;e.preventDefault();await loadMembers();
 const ids=[...document.querySelectorAll('.tmM')].map(x=>memberId(x.value));
 if(ids.some(x=>!x)){msg={ok:false,text:'Pick each teammate from the list of club members (start typing their name).'};render();return}
 await act(`/api/tournaments/${TID}/team`,{name:$('tmName').value,members:ids},'Team created! Your teammates have been invited.')});
load();setInterval(()=>{if(!document.hidden&&!busy&&D&&!document.activeElement?.closest?.('form,.order,.tm-actions')&&['checkin','live','signup'].includes(D.tournament.status))load()},10000);

</script>
