<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tournament — The Cheese Club</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c0e;--gold:#f0b82f;--white:#f6f3eb;--muted:#98969a;--line:#2b2925}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -30%,#3a2910 0,transparent 44%),var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}.shell{max-width:1400px;margin:auto;padding:0 34px}.topbar{min-height:88px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #ffffff12}.brand{display:flex;align-items:center;gap:14px}.brand img{width:130px;height:65px;object-fit:contain}.brand b{display:block;font:800 20px 'Barlow Condensed';letter-spacing:1px}.brand small{color:var(--gold);font-size:9px;letter-spacing:2px}.nav{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#c8c4bc}.nav a:hover{color:var(--gold)}.discord{background:linear-gradient(135deg,#f5c64c,#c98713);color:#201707;padding:12px 16px;border-radius:9px;font-weight:800;font-size:11px}.content{min-height:65vh;display:grid;place-items:center;text-align:center}.card{max-width:650px;padding:55px 28px;background:#17171b;border:1px solid #6e5424;border-radius:18px}.eyebrow{color:var(--gold);font-size:10px;font-weight:800;letter-spacing:3px}h1{font:800 clamp(48px,8vw,76px)/.95 'Barlow Condensed';margin:14px 0;text-transform:uppercase}p{color:#aaa;line-height:1.8;font-size:14px}.tag{display:inline-block;border:1px solid #69511e;color:var(--gold);padding:8px 12px;border-radius:30px;font-size:10px;letter-spacing:2px;margin-top:10px}.back{position:fixed;left:18px;bottom:18px;background:#1b1b20;border:1px solid #70551e;border-radius:9px;padding:11px 15px;font-weight:800}@media(max-width:850px){.topbar{padding:12px 0;flex-wrap:wrap}.nav{gap:10px}.shell{padding:0 18px}}</style></head><body><button class="back" onclick="if(history.length>1)history.back();else location.href='/'">← Back</button><div class="shell"><header class="topbar"><a class="brand" href="/"><img src="/static/cheese-club-logo.png" alt="The Cheese Club"><span><b>THE CHEESE CLUB</b><small>COMMUNITY HUB</small></span></a><nav class="nav"><a href="/">Home</a><a href="/leaderboard">Leaderboard</a><a href="/matches">Matches</a><a href="/community">Community</a><a href="/voice-activity">Voice Activity</a><a href="/tournament">Tournament</a><a href="/contact">Contact Us</a><a href="/login">Login</a><a href="/signup">Sign Up</a></nav><a class="discord" href="https://discord.gg/thecheeseclub" target="_blank" rel="noopener noreferrer">JOIN DISCORD ↗</a></header><main class="content"><section class="card"><div class="eyebrow">THE CHEESE CLUB</div><h1>Tournament</h1><p>Tournament events, brackets, registrations and results will be available here soon.</p><span class="tag">COMING SOON</span></section></main></div><script>(function(){const path=location.pathname.replace(/\/$/,'')||'/';document.querySelectorAll('.nav a').forEach(a=>{const href=new URL(a.href,location.origin).pathname.replace(/\/$/,'')||'/';if(href===path){a.classList.add('active');a.setAttribute('aria-current','page')}else{a.classList.remove('active');a.removeAttribute('aria-current')}})})();</script></body></html>
